<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8fa">
  <meta name="description" content="Một bó hoa và tấm thiệp nhỏ, gửi những lời chúc dịu dàng nhân ngày Phụ nữ Việt Nam 20/10.">
  <title>Một bó hoa dành tặng bạn · 20/10</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
  <script src="./card.js" defer></script>
</head>
<body>
  <main>
    <canvas id="ambientPetalsCanvas" aria-hidden="true"></canvas>
    <header class="greeting">
      <p class="occasion">Ngày Phụ nữ Việt Nam <span>20/10</span></p>
      <h1>Một bó hoa nhỏ,<br>gửi ngàn yêu thương.</h1>
      <p class="greeting-caption">Mong hôm nay của bạn thật dịu dàng.</p>
    </header>

    <div class="gift-layout">
      <section class="scene-column" aria-label="Hoa và những lời chúc 20/10">


        <div class="gift-visuals">
          <div class="bouquet-composition">
            <div id="bouquetStageWrapper" role="button" tabindex="0"
              aria-label="Bó hoa hồng. Nhấn Enter để nhận lời chúc; dùng phím mũi tên để chọn bông hoa."
              aria-describedby="bouquetHint">
              <canvas id="bouquetCanvas" aria-hidden="true"></canvas>
            </div>
            <button class="envelope-button" id="openCard" type="button" aria-haspopup="dialog" aria-controls="greetingCard" aria-expanded="false" hidden>
              <span class="envelope" aria-hidden="true"><span class="envelope-letter">Gửi con Nơ</span><span class="envelope-seal">♡</span></span>
              <span class="envelope-caption">Có một tấm thiệp cho bạn</span>
              <span class="envelope-action">Mở thiệp</span>
            </button>
          </div>

        </div>

        <footer class="scene-footer">
          <p id="bouquetHint" class="bouquet-hint">Chạm một bông hoa để nhận lời chúc</p>
          <p id="roseWish" class="rose-wish" role="status" aria-live="polite" aria-atomic="true"></p>
          <button class="text-button" id="replayBloom" type="button">Cho hoa nở lại <span aria-hidden="true">↻</span></button>
        </footer>
      </section>

      <dialog id="greetingCard" class="card-dialog" aria-labelledby="cardTitle">
        <div class="letter-paper">
          <button class="close-button" id="closeCard" type="button" aria-label="Đóng thiệp">×</button>
          <div id="cardReading">
            <div class="letter-date" aria-label="Ngày 20 tháng 10"><span>20</span><span class="date-stem" aria-hidden="true"></span><span>10</span></div>
            <h2 id="cardTitle" style="text-align: center; margin: 22px 0 28px; font-size: clamp(24px, 4.2vw, 32px); line-height: 1.4;">Ê con Nơ thúi 20/10<br>vui vẻ nhe ê 🎀</h2>
          </div>
          <p id="cardStatus" class="card-status" role="status" aria-live="polite"></p>
        </div>
      </dialog>
    </div>
    <section id="memoryAlbum" class="memory-album" aria-labelledby="albumTitle" hidden>
      <header class="album-heading">
        <p class="album-note">Một chút kỷ niệm, dành riêng cho bạn</p>
        <h2 id="albumTitle">Những khoảnh khắc thương yêu</h2>
      </header>
      <div id="albumPhotos" class="album-photos" style="display: flex; justify-content: center; padding: 18px 18px 14px;">
        <figure class="portrait-card album-card" style="grid-area: auto; width: min(100%, 300px); max-width: 320px; transform: rotate(-1.5deg);">
          <div class="portrait-photo" style="aspect-ratio: 1 / 1;">
            <img src="./assets/no.jpg" alt="Ảnh con Nơ" width="724" height="726" decoding="async">
          </div>
          <figcaption>
            <span class="portrait-dedication">Xinh đẹp rạng rỡ nha con Nơ 🎀</span>
            <span class="portrait-date">20 / 10 / 2026</span>
          </figcaption>
        </figure>
      </div>
      <p class="album-footnote">Có những điều nhỏ, nhớ lại vẫn thấy vui.</p>
    </section>
    <noscript><p class="noscript-message">Bật JavaScript để ngắm hoa nở và mở thiệp 20/10 nhé.</p></noscript>
  </main>
</body>
</html>
